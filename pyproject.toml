[project]
name = "ai-docu"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sudhaKarRanji", email = "sudha0523@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.165.0",
    "flask[standard]>=3.1.3",
    "langchain>=1.5.2",
    "pydantic>=2.14.4",
    "pymupdf>=2.1",
    "pytest>=9.2.0",
    "python-docs>=0.1.0",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-docu = "ai_docu:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
